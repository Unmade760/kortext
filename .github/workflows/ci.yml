name: Kortext CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux-substrates:
    name: Linux Full Substrate Suite (FalkorDB + Qdrant)
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for Services
        run: |
          echo "Waiting for background services..."
          for i in {1..30}; do
            if nc -z localhost 6379 && curl -s -f http://localhost:6333/healthz > /dev/null 2>&1; then
              echo "FalkorDB and Qdrant are ready!"
              break
            fi
            echo "Waiting for services to become healthy ($i/30)..."
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --extra tier2-languages --extra dev

      - name: Run Kortext Test Suite
        env:
          CI: "1"
        run: |
          uv run pytest -q

      - name: Run Antigravity Lifecycle Hooks Test Suite
        run: |
          uv run python3 scripts/test_antigravity_hooks.py

      - name: Run Plugin Manifest Validation
        run: |
          uv run python3 scripts/test_plugin_manifest.py

  test-cross-platform:
    name: Cross-Platform Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --extra tier2-languages --extra dev

      - name: Run Plugin Manifest & Hooks Suite
        run: |
          uv run python3 scripts/test_plugin_manifest.py
          uv run python3 scripts/test_antigravity_hooks.py

      - name: Run Cross-Platform Unit & Regression Suites
        env:
          CI: "1"
        run: |
          uv run pytest -q tests/test_cli_commands.py tests/test_binaries.py tests/test_retrieval_pipeline.py tests/test_dashboard_routes.py tests/test_graph_views.py tests/test_audit_regressions.py tests/test_audit_fixes.py tests/test_deep_audit_remediations.py tests/test_complete_audit_verification.py
