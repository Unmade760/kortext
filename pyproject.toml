[project]
name = "cerebrum"
version = "2.0.0"
description = "5-Tier Dual-Memory, AST Code Intelligence & Cognitive OS for Google Antigravity CLI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Supreme Knight", email = "realrajdeep09@gmail.com" }
]
keywords = [
  "antigravity", "mcp", "fastmcp", "code-intelligence", "rag",
  "knowledge-graph", "falkordb", "qdrant", "tree-sitter", "ast", "hipporag"
]
dependencies = [
  "fastmcp>=2.0",
  "langgraph>=0.3",
  "llama-index-core>=0.12",
  "llama-index-embeddings-openai>=0.3",
  "llama-index-vector-stores-qdrant>=0.4",
  "qdrant-client>=1.12.0",
  "graphiti-core>=0.4",
  "redis>=5.0.0",
  "tree-sitter>=0.23.2,<0.27.0",
  "tree-sitter-python>=0.23.6,<0.26.0",
  "tree-sitter-typescript>=0.23.2,<0.24.0",
  "tree-sitter-javascript>=0.23.0,<0.26.0",
  "tree-sitter-rust>=0.23.0,<0.25.0",
  "tree-sitter-go>=0.23.0,<0.26.0",
  "protobuf>=4.25",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "watchdog>=4.0",
  "aiofiles>=23.2",
  "rich>=13.7",
  "falkordb>=1.7.1",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
tier2-languages = [
  "tree-sitter-c>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "tree-sitter-java>=0.23.0",
  "tree-sitter-kotlin>=1.0.0",
  "tree-sitter-swift>=0.7.0",
  "tree-sitter-c-sharp>=0.23.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
cerebrum           = "cerebrum.cli:main"
cerebrum-server    = "cerebrum.server:main"
cerebrum-ingest    = "cerebrum.ingest:main"
cerebrum-watch     = "cerebrum.watcher:main"
cerebrum-dashboard = "cerebrum.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
