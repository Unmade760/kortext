<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Node Gradients -->
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="grad-ast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="grad-vector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="grad-dream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="edge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="512" height="512" rx="104" fill="url(#bg-glow)"/>
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Synaptic Network Interconnects (Edges) -->
  <g stroke="url(#edge-glow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Outer Hexagonal / Pentagon Memory Ring -->
    <line x1="256" y1="84" x2="416" y2="176" stroke-dasharray="4, 4"/>
    <line x1="416" y1="176" x2="384" y2="368"/>
    <line x1="384" y1="368" x2="256" y2="432" stroke-dasharray="6, 4"/>
    <line x1="256" y1="432" x2="128" y2="368"/>
    <line x1="128" y1="368" x2="96" y2="176" stroke-dasharray="4, 4"/>
    <line x1="96" y1="176" x2="256" y2="84"/>

    <!-- Central Knowledge Hub Synapses ('K' Geometry) -->
    <line x1="190" y1="140" x2="190" y2="372" stroke="#6366f1" stroke-width="6" filter="url(#neon-glow)"/>
    <line x1="190" y1="256" x2="330" y2="140" stroke="#a855f7" stroke-width="5" filter="url(#neon-glow)"/>
    <line x1="190" y1="256" x2="336" y2="372" stroke="#38bdf8" stroke-width="5" filter="url(#neon-glow)"/>

    <!-- Cross-Tier Associative Links -->
    <line x1="96" y1="176" x2="190" y2="256" opacity="0.6"/>
    <line x1="416" y1="176" x2="330" y2="140" opacity="0.6"/>
    <line x1="384" y1="368" x2="336" y2="372" opacity="0.6"/>
    <line x1="256" y1="84" x2="190" y2="140" opacity="0.6"/>
    <line x1="128" y1="368" x2="190" y2="372" opacity="0.6"/>
  </g>

  <!-- Peripheral Knowledge Nodes (5 Memory Tiers) -->
  <!-- Tier 0: AST Symbol Node (Top) -->
  <circle cx="256" cy="84" r="16" fill="url(#grad-ast)" filter="url(#neon-glow)"/>
  <circle cx="256" cy="84" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- Tier 1: Vector Space (Top-Right) -->
  <circle cx="416" cy="176" r="18" fill="url(#grad-vector)" filter="url(#neon-glow)"/>
  <circle cx="416" cy="176" r="9" fill="#ffffff" opacity="0.9"/>

  <!-- Tier 2: Episodic & Causal (Bottom-Right) -->
  <circle cx="384" cy="368" r="17" fill="url(#grad-dream)" filter="url(#neon-glow)"/>
  <circle cx="384" cy="368" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- Tier 3: Federated Engine (Bottom) -->
  <circle cx="256" cy="432" r="16" fill="url(#grad-core)" filter="url(#neon-glow)"/>
  <circle cx="256" cy="432" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- Tier 4: Cognitive Dream (Bottom-Left) -->
  <circle cx="128" cy="368" r="17" fill="url(#grad-dream)" filter="url(#neon-glow)"/>
  <circle cx="128" cy="368" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- Symbolic Logic Gateway (Top-Left) -->
  <circle cx="96" cy="176" r="15" fill="url(#grad-ast)" filter="url(#neon-glow)"/>
  <circle cx="96" cy="176" r="7" fill="#ffffff" opacity="0.9"/>

  <!-- Central Nexus Nodes ('K' Backbone) -->
  <circle cx="190" cy="140" r="14" fill="#6366f1" filter="url(#neon-glow)"/>
  <circle cx="190" cy="256" r="20" fill="url(#grad-core)" filter="url(#soft-glow)"/>
  <circle cx="190" cy="256" r="10" fill="#ffffff"/>
  <circle cx="190" cy="372" r="14" fill="#6366f1" filter="url(#neon-glow)"/>

  <circle cx="330" cy="140" r="16" fill="#a855f7" filter="url(#neon-glow)"/>
  <circle cx="330" cy="140" r="8" fill="#ffffff" opacity="0.9"/>

  <circle cx="336" cy="372" r="16" fill="#0ea5e9" filter="url(#neon-glow)"/>
  <circle cx="336" cy="372" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
